<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1 style="text-align: center;">Contact Details</h1>
    <fieldset>
<form action="">
<h3>Please enter your personal details.</h3>
<label for="name">First Name:* <input type="text" id="name" placeholder="i.e Fred" required></label><br><br>
<label for="last_name">Last Name: <input type="last_name" id="last_name" placeholder="i.e Bloggs"></label><br><br>
<label for="Street">Street Address:* <input type="text" id="Street" required></label><br><br>
<label for="Town">Town City: <input type="text" id="Town"></label><br><br>
<label for="Postcode">Postcode Zip: <input type="tel" id="Postcode"></label><br><br>
<label for="Telephone">Telephone: <input type="tel" id="Telephone" placeholder="042-111-11111"></label><br><br>
<label for="Mobile">Mobile:* <input type="tel" id="Mobile" placeholder="+92 300 1111111" required></label><br><br>
<label for="Email">Email Address:* <input type="email" id="Email" required></label><br><br>
<span>Fields marked * are required.</span>
<input type="submit" style="display: block; margin: auto;">
</form>
    </fieldset>
</body>
</html>
